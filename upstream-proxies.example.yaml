# Configured Upstream Proxy
# =========================
# Copy this file to the ghc-api config directory as upstream-proxies.yaml,
# or point GHC_API_PROXY_CONFIG at a private YAML file outside the repository.
#
# This example intentionally uses reserved example domains and placeholder
# headers. Keep real endpoints, credential commands, headers, and model routes
# in your private local configuration only.

proxies:
  example-llm:
    enabled: true

    # Authentication options:
    #   type: none
    #   type: bearer_env + env: VARIABLE_NAME
    #   type: bearer_command + command: [executable, arg1, ...]
    #   type: header_command + header: api-key + command: [executable, arg1, ...]
    # header_command requires an explicit header name and sends no Bearer prefix.
    auth:
      type: bearer_env
      env: EXAMPLE_LLM_TOKEN

    # Shared outbound headers. Client credentials are not forwarded.
    headers:
      X-Client-Type: coding-agent
      X-Quota-Id: ""

    # Capture a routing/affinity header from an upstream response and include it
    # on later requests for the same API/model route.
    affinity:
      enabled: true
      response_header: X-Route-Token
      request_header: X-Route-Token
      scope: model
      persist: true

    apis:
      responses:
        enabled: true
        upstream_url: https://gateway.example.test/responses
        timeout_seconds: 180
        max_connection_retries: 1
        request_model: omit       # preserve | omit | upstream
        response_model: public    # preserve | public
        headers:
          X-Protocol: responses

      chat_completions:
        enabled: true
        upstream_url: https://gateway.example.test/chat/completions
        timeout_seconds: 180
        max_connection_retries: 1
        request_model: upstream
        response_model: public
        headers:
          X-Protocol: chat-completions

      # Native Anthropic Messages passthrough (no OpenAI translation).
      messages:
        enabled: true
        upstream_url: https://api.anthropic.com/v1/messages
        timeout_seconds: 180
        max_connection_retries: 1
        request_model: upstream
        response_model: public
        headers:
          anthropic-version: "2023-06-01"
          x-api-key: "${ANTHROPIC_API_KEY}"
        # Optional, opt-in forwarding of one client header per binding.
        # A missing client value is generated; a supplied one must be a UUID v4
        # and is echoed back on the response. Credential names, structural
        # names, and the affinity headers above are rejected.
        header_bindings:
          - client_name: X-Client-Session
            upstream_name: X-Upstream-Session
            value_type: uuid_v4

    models:
      example-coding-model:
        display_name: Example Coding Model
        reasoning: true
        input: [text]
        context_window: 128000
        max_output_tokens: 16384

        # Shared model-specific outbound headers.
        headers:
          X-Upstream-Model: example-route

        apis:
          responses:
            enabled: true
            upstream_model: null

          chat_completions:
            enabled: true
            upstream_model: example-chat-deployment

          messages:
            enabled: true
            upstream_model: claude-sonnet-4-5

  # Decision / System One passthrough (Microsoft-Decision-1 and compatible
  # models). A decision model returns calibrated probabilities instead of text,
  # so it is intentionally absent from the built-in Chat page model list.
  example-decision:
    enabled: true

    auth:
      type: none

    apis:
      # Non-streaming only. request_model must not be 'omit' because the
      # upstream resolves the deployment from the request body.
      systemone:
        enabled: true
        upstream_url: https://gateway.example.test/providers/microsoft/v1/systemone
        timeout_seconds: 60
        request_model: upstream
        response_model: public
        headers:
          api-key: "${EXAMPLE_DECISION_API_KEY}"

    models:
      microsoft-decision-1:
        display_name: Microsoft Decision 1
        input: [text]
        context_window: 32000
        apis:
          systemone:
            enabled: true
            # The Foundry deployment name, not the catalog model name.
            upstream_model: example-decision-deployment

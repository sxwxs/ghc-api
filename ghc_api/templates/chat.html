            const endpoint = resolveEndpoint(payload);
            const isStream = !!payload.stream;

            let session = getActiveSession();
            if (!session) {
                newSession();
                session = getActiveSession();
            }

            // Save raw request to session
            session.messages.push({ role: 'raw-request', content: text, endpoint });
            if (session.messages.length === 1) {
                session.title = '[Raw] ' + endpoint;
                renderSessionList();
            }
            saveSessions();

            // Show request message
            const container = document.getElementById('messages-container');
            const emptyEl = container.querySelector('.empty-state');
            if (emptyEl) emptyEl.remove();

            const reqDiv = document.createElement('div');
            reqDiv.className = 'message raw-request';
            reqDiv.innerHTML = `<span class="raw-label">${escapeHtml(endpoint)}</span>\n` + syntaxHighlightJson(payload);
            container.appendChild(reqDiv);

            input.value = '';
            autoResize(input);
            scrollToBottom();

            // Create response placeholder
            const resDiv = document.createElement('div');
            resDiv.className = 'message raw-response';
            resDiv.innerHTML = '<span class="raw-label">Response</span>\n<span class="typing-indicator">Waiting</span>';
            container.appendChild(resDiv);
            scrollToBottom();

            isStreaming = true;
            document.getElementById('send-btn').disabled = true;
            abortController = new AbortController();
            const startTime = performance.now();

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                    signal: abortController.signal,
                });

                if (!isStream) {
                    // Non-streaming: read full response
                    const contentType = res.headers.get('content-type') || '';
                    let responseText;
                    if (contentType.includes('json')) {
                        const jsonData = await res.json();
                        responseText = JSON.stringify(jsonData, null, 2);
                        resDiv.innerHTML = `<span class="raw-label">Response ${res.status} (${formatDuration((performance.now() - startTime) / 1000)})</span>\n` + syntaxHighlightJson(jsonData);
                    } else {
                        responseText = await res.text();
                        resDiv.innerHTML = `<span class="raw-label">Response ${res.status} (${formatDuration((performance.now() - startTime) / 1000)})</span>\n` + escapeHtml(responseText);
                    }
                    session.messages.push({ role: 'raw-response', content: responseText, statusCode: res.status });
                    saveSessions();
                } else {
                    // Streaming: show SSE events incrementally
                    const reader = res.body.getReader();
                    const decoder = new TextDecoder();
                    let accumulated = '';
                    let eventCount = 0;

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        const chunk = decoder.decode(value, { stream: true });
                        accumulated += chunk;
                        eventCount++;

                        // Render accumulated SSE, with some color highlighting
                        let display = accumulated;
                        // Highlight event: and data: prefixes
                        display = escapeHtml(display);
                        display = display.replace(/^(event: .+)$/gm, '<span class="json-key">$1</span>');
                        display = display.replace(/^(data: )(\[DONE\])$/gm, '<span class="json-null">$1$2</span>');

                        const elapsed = formatDuration((performance.now() - startTime) / 1000);
                        resDiv.innerHTML = `<span class="raw-label">Response ${res.status} | streaming | ${eventCount} chunks | ${elapsed}</span>\n` + display;

                        // Auto-scroll, but throttle to avoid jank
                        if (eventCount % 3 === 0 || eventCount < 5) {
                            resDiv.scrollTop = resDiv.scrollHeight;
                            scrollToBottom();
                        }
                    }

                    const totalTime = formatDuration((performance.now() - startTime) / 1000);
                    let display = escapeHtml(accumulated);
                    display = display.replace(/^(event: .+)$/gm, '<span class="json-key">$1</span>');
                    display = display.replace(/^(data: )(\[DONE\])$/gm, '<span class="json-null">$1$2</span>');
                    resDiv.innerHTML = `<span class="raw-label">Response ${res.status} | ${eventCount} chunks | ${totalTime}</span>\n` + display;
                    resDiv.scrollTop = resDiv.scrollHeight;

                    session.messages.push({ role: 'raw-response', content: accumulated, statusCode: res.status });
                    saveSessions();
                }
            } catch (err) {
                if (err.name === 'AbortError') return;
                resDiv.innerHTML = `<span class="raw-label">Error</span>\n` + escapeHtml(err.message);
                resDiv.style.borderColor = '#ef9a9a';
            } finally {
                isStreaming = false;
                document.getElementById('send-btn').disabled = false;
                abortController = null;
            }
            scrollToBottom();
        }

        // ---- Input handling ----

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 150) + 'px';
        }

        const chatInput = document.getElementById('chat-input');
        chatInput.addEventListener('input', () => autoResize(chatInput));
        chatInput.addEventListener('keydown', (e) => {
            if (rawMode) {
                // In raw mode: Ctrl+Enter to send (Enter is for editing JSON)
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    sendMessage();
                }
                // Allow Tab to insert spaces in raw mode
                if (e.key === 'Tab') {
                    e.preventDefault();
                    const start = chatInput.selectionStart;
                    const end = chatInput.selectionEnd;
                    chatInput.value = chatInput.value.substring(0, start) + '  ' + chatInput.value.substring(end);
                    chatInput.selectionStart = chatInput.selectionEnd = start + 2;
                }
            } else {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            }
        });

        // ---- Init ----

        loadSessions();
        const savedWebSearchSetting = localStorage.getItem(WEB_SEARCH_KEY);
        const savedWebIqSearchSetting = localStorage.getItem(WEBIQ_SEARCH_KEY);
        document.getElementById('web-search-enabled').checked =
            savedWebSearchSetting === null || savedWebSearchSetting === 'true';
        document.getElementById('webiq-search-enabled').checked =
            savedWebIqSearchSetting === 'true';
        // Avoid restoring two mutually exclusive providers from old browser state.
        if (document.getElementById('webiq-search-enabled').checked) {
            document.getElementById('web-search-enabled').checked = false;
        }
        updateWebSearchAvailability();
        renderSessionList();
        renderMessages();
        loadModels();
    </script>
</body>
</html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · ghc-api</title>
<style>
:root{color-scheme:dark}body{font:16px system-ui;margin:0;background:#0d1117;color:#e6edf3}.card{max-width:34rem;margin:8vh auto;padding:2rem;background:#161b22;border:1px solid #30363d;border-radius:12px}input,button{box-sizing:border-box;width:100%;padding:.75rem;margin:.35rem 0 1rem;border-radius:6px;border:1px solid #30363d;background:#0d1117;color:#e6edf3}button{background:#238636;border-color:#2ea043;cursor:pointer;font-weight:600}button:disabled{opacity:.6}.code{font:700 2rem ui-monospace;text-align:center;letter-spacing:.12em;padding:1rem;border:1px solid #30363d;border-radius:8px}.muted{color:#8b949e}.error{color:#ff7b72}img{max-width:100%;background:white;border-radius:4px}
</style></head><body><main class="card"><h1>Email sign-in</h1><div id="root">Loading…</div></main>
<script>
const root=document.querySelector('#root'); const nextUrl={{ next_url|tojson }};
async function api(path,options={}){const r=await fetch(path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const j=await r.json();if(!r.ok)throw new Error(j.message||j.error||'Request failed');return j}
async function loadCaptcha(){const c=await api('/api/auth/captcha');document.querySelector('#captcha').src=c.image}
async function render(){const state=await api('/api/auth/state');if(state.logged_in){location.href=state.is_admin?nextUrl:'/account';return}root.innerHTML=`<p class="muted">A confirmation link will be emailed to you. The email link and the code shown here are both required.</p><form id="login"><label>Email</label><input id="email" type="email" autocomplete="email" required><img id="captcha" alt="CAPTCHA"><label>CAPTCHA</label><input id="answer" autocomplete="off" required><button>Send sign-in email</button></form><div id="message"></div><p><a href="/signup">Register an account</a></p>`;await loadCaptcha();document.querySelector('#login').onsubmit=start}
async function start(e){e.preventDefault();try{const result=await api('/api/auth/request',{method:'POST',body:JSON.stringify({email:document.querySelector('#email').value,captcha:document.querySelector('#answer').value})});document.querySelector('#login').hidden=true;document.querySelector('#message').innerHTML=`<p>Open the email and enter this code:</p><div class="code">${escapeHtml(result.user_code)}</div><p class="muted">Waiting for confirmation…</p>`;const timer=setInterval(async()=>{try{const s=await api('/api/auth/status');if(s.status==='approved'){clearInterval(timer);location.href=nextUrl}else if(s.status==='expired'){clearInterval(timer);document.querySelector('#message').innerHTML='<p class="error">The request expired. Reload and try again.</p>'}}catch(err){clearInterval(timer);document.querySelector('#message').innerHTML=`<p class="error">${escapeHtml(err.message)}</p>`}},1500)}catch(err){document.querySelector('#message').innerHTML=`<p class="error">${escapeHtml(err.message)}</p>`;await loadCaptcha()}}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}render().catch(e=>root.innerHTML=`<p class="error">${escapeHtml(e.message)}</p>`)
</script></body></html>

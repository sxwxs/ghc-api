<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register · ghc-api</title>
<style>:root{color-scheme:dark}body{font:16px system-ui;margin:0;background:#0d1117;color:#e6edf3}.card{max-width:36rem;margin:6vh auto;padding:2rem;background:#161b22;border:1px solid #30363d;border-radius:12px}input,button{box-sizing:border-box;width:100%;padding:.75rem;margin:.35rem 0 1rem;border-radius:6px;border:1px solid #30363d;background:#0d1117;color:#e6edf3}button{background:#238636;cursor:pointer}.code{font:700 2rem ui-monospace;text-align:center;letter-spacing:.12em;padding:1rem;border:1px solid #30363d;border-radius:8px}.muted{color:#8b949e}.error{color:#ff7b72}.token{word-break:break-all;font:14px ui-monospace;padding:1rem;background:#0d1117}img{max-width:100%;background:white}</style></head>
<body><main class="card"><h1>Register</h1>
{% if allow_public_registration %}<p class="muted">Verify your email first. The account remains pending until an administrator approves it.</p>{% else %}<p class="muted">Public registration is disabled. Only an email address invited by an administrator will receive a verification message.</p>{% endif %}
<form id="form"><label>Email</label><input id="email" type="email" required><label>User ID</label><input id="userId" required maxlength="64" pattern="[A-Za-z0-9_.-]+"><label>Display name</label><input id="displayName"><img id="captcha" alt="CAPTCHA"><label>CAPTCHA</label><input id="answer" required><button>Verify email</button></form><div id="message"></div><p><a href="/login">Back to sign in</a></p></main>
<script>
const form=document.querySelector('#form'),message=document.querySelector('#message');let details={};
async function api(path,options={}){const r=await fetch(path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const j=await r.json();if(!r.ok)throw new Error(j.message||j.error||'Request failed');return j}
async function captcha(){const c=await api('/api/register/captcha');document.querySelector('#captcha').src=c.image}
form.onsubmit=async e=>{e.preventDefault();details={user_id:document.querySelector('#userId').value.trim(),display_name:document.querySelector('#displayName').value.trim()};try{const r=await api('/api/register/request',{method:'POST',body:JSON.stringify({email:document.querySelector('#email').value,captcha:document.querySelector('#answer').value})});form.hidden=true;message.innerHTML=`<p>Open the email and enter this code:</p><div class="code">${esc(r.user_code)}</div><p class="muted">Waiting for verification…</p>`;const timer=setInterval(async()=>{try{const s=await api('/api/register/status');if(s.status==='verified'){clearInterval(timer);const done=await api('/signup',{method:'POST',body:JSON.stringify(details)});message.innerHTML=`<h2>Email verified</h2><p>Your account is pending administrator approval.</p><p>API token:</p><div class="token">${esc(done.token)}</div>`}else if(s.status==='expired'){clearInterval(timer);message.innerHTML='<p class="error">Verification expired. Reload and try again.</p>'}}catch(err){clearInterval(timer);message.innerHTML=`<p class="error">${esc(err.message)}</p>`}},1500)}catch(err){message.innerHTML=`<p class="error">${esc(err.message)}</p>`;await captcha()}};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}captcha().catch(e=>message.innerHTML=`<p class="error">${esc(e.message)}</p>`)
</script></body></html>
